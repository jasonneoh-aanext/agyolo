[package]
name = "agy-test"
version = "1.0.0"
description = "Antigravity Headless PTY Console (macOS Tauri App)"
authors = ["Jason Neoh"]
edition = "2021"

[lib]
name = "antigravity_console_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
libc = "0.2"

