<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity · Headless PTY Console</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand-wrap">
      <button
        id="sidebarToggleBtn"
        class="btn-sidebar-toggle"
        type="button"
        title="Toggle Sessions Sidebar"
        aria-label="Toggle Sessions Sidebar"
      >
        ☰
      </button>
      <div class="brand">
        <div class="brand-icon">A</div>
        <span>Antigravity</span>
        <span class="brand-sub">YOLO PTY · Auto-Enter</span>
      </div>
      <div id="activeRunsBadge" class="active-runs-badge" title="Concurrent sessions running in background">
        <span class="dot running"></span>
        <span id="activeRunsText">0 Active</span>
      </div>
    </div>

    <div class="controls">
      <!-- Base Path Selector -->
      <div class="control-group" title="Workspace base directory (cwd) passed to node-pty">
        <span class="control-label">Path</span>
        <input id="cwdInput" class="path-input" list="workspacePresets" placeholder="/Users/jason/projects/..." />
        <datalist id="workspacePresets"></datalist>
      </div>
    </div>
  </header>

  <!-- Main App Body: Left Session Sidebar + Right Chat Column -->
  <div class="app-body">
    <aside id="sidebar" class="sidebar" aria-label="Conversation Sessions">
      <div class="sidebar-header">
        <div class="sidebar-title-wrap">
          <span class="sidebar-title">Sessions</span>
          <span id="sidebarCount" class="sidebar-count">0</span>
        </div>
      </div>
      <div class="sidebar-body">
        <button
          id="newSessionBtn"
          class="session-item btn-new active"
          type="button"
          data-session-key="__new__"
        >
          <div class="session-item-top">
            <span class="btn-new-icon">+</span>
            <span class="session-item-title">New Session</span>
          </div>
        </button>
        <div id="sidebarList" class="sidebar-list"></div>
      </div>
    </aside>

    <div class="main-column">
      <!-- Main Chat & Event Stream -->
      <main id="viewport" class="main-viewport">
        <div id="stream" class="stream-container"></div>
      </main>

      <!-- Bottom Input Box -->
      <footer class="composer-wrap">
        <div class="composer-box">
          <textarea
            id="promptInput"
            class="composer-input"
            rows="2"
            placeholder="Ask Antigravity anything... (Enter to send, Shift+Enter for newline)"
          ></textarea>
          <div class="composer-footer">
            <div class="status-indicator">
              <span id="statusDot" class="dot done"></span>
              <span id="statusText">Idle · Ready</span>
            </div>
            <button id="sendBtn" class="btn-send" type="button">Send ↵</button>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <!-- Startup Prechecks Modal -->
  <div
    id="precheckModal"
    class="precheck-modal-backdrop"
    role="dialog"
    aria-modal="true"
    aria-labelledby="precheckModalTitle"
  >
    <div class="precheck-modal-card">
      <div class="precheck-modal-header">
        <div class="precheck-brand-row">
          <div class="brand-icon precheck-brand-icon">A</div>
          <div>
            <h2 id="precheckModalTitle" class="precheck-modal-title">Startup Prechecks</h2>
            <p id="precheckModalSubtitle" class="precheck-modal-subtitle">
              Verifying Antigravity CLI environment before starting...
            </p>
          </div>
        </div>
        <span id="precheckStatusBadge" class="precheck-badge checking">Checking 1/2</span>
      </div>

      <div class="precheck-progress-section">
        <div class="precheck-progress-meta">
          <span id="precheckProgressLabel" class="precheck-progress-label">
            Preparing prechecks...
          </span>
          <span id="precheckProgressPercent" class="precheck-progress-percent">0%</span>
        </div>
        <div class="precheck-progress-track">
          <div id="precheckProgressFill" class="precheck-progress-fill" style="width: 0%"></div>
        </div>
      </div>

      <div id="precheckList" class="precheck-list" role="list"></div>

      <div class="precheck-modal-footer">
        <span id="precheckFooterHint" class="precheck-footer-hint">
          Each check pauses for 2s before advancing...
        </span>
        <div id="precheckActions" class="precheck-modal-actions hidden">
          <button id="precheckDismissBtn" class="btn-precheck-secondary" type="button">
            Continue Anyway
          </button>
          <button id="precheckRetryBtn" class="btn-precheck-primary" type="button">
            Retry Prechecks
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="/precheckModal.js"></script>
  <script src="/app.js"></script>
</body>
</html>
