<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Antigravity · Headless PTY Console</title>
  <style>
    :root {
      --bg-base: #0a0c10;
      --bg-surface: #11141c;
      --bg-elevated: #171b26;
      --bg-hover: #1e2330;
      --border-subtle: rgba(255, 255, 255, 0.07);
      --border-focus: rgba(96, 145, 255, 0.45);
      --text-primary: #eef2f8;
      --text-secondary: #949eb0;
      --text-muted: #5e6778;
      --accent-blue: #5894ff;
      --accent-indigo: #7c6aff;
      --accent-green: #34d399;
      --accent-amber: #fbbf24;
      --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', system-ui, sans-serif;
      --font-mono: 'SF Mono', 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--bg-base);
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Navigation / Control Bar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 20px;
      background: rgba(17, 20, 28, 0.88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
      z-index: 10;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: -0.01em;
      color: var(--text-primary);
    }

    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 45%, #5894ff 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 2px 10px rgba(88, 148, 255, 0.25);
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(88, 148, 255, 0.12);
      color: var(--accent-blue);
      border: 1px solid rgba(88, 148, 255, 0.25);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      flex: 1;
      justify-content: flex-end;
    }

    .control-group {
      display: flex;
      align-items: center;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 3px 8px;
      gap: 6px;
      transition: border-color 0.15s;
    }

    .control-group:focus-within {
      border-color: var(--border-focus);
    }

    .control-label {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      user-select: none;
    }

    .path-input, .session-select {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 4px 2px;
      outline: none;
    }

    .path-input {
      width: 240px;
    }

    .session-select {
      max-width: 230px;
      cursor: pointer;
    }

    .session-select option {
      background: var(--bg-surface);
      color: var(--text-primary);
    }

    .btn-new {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-primary);
      background: linear-gradient(180deg, rgba(88, 148, 255, 0.18), rgba(88, 148, 255, 0.08));
      border: 1px solid rgba(88, 148, 255, 0.32);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-new:hover {
      background: rgba(88, 148, 255, 0.26);
      border-color: rgba(88, 148, 255, 0.55);
    }

    /* Main Scrollable Message Stream */
    .main-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px 36px;
      scroll-behavior: smooth;
    }

    .stream-container {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 64px 20px 32px;
      color: var(--text-secondary);
    }

    .empty-state h2 {
      font-size: 18px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0 0 6px;
    }

    .empty-state p {
      font-size: 13px;
      color: var(--text-muted);
      max-width: 500px;
      margin: 0 auto 20px;
    }

    .quick-chips {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .chip {
      font-size: 12px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.15s;
    }

    .chip:hover {
      border-color: var(--border-focus);
      color: var(--text-primary);
      background: var(--bg-elevated);
    }

    /* Primary User Message */
    .msg-user {
      align-self: flex-end;
      max-width: 78%;
      background: var(--bg-elevated);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: var(--text-primary);
      padding: 10px 15px;
      border-radius: 14px 14px 4px 14px;
      font-size: 14px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Primary Assistant Message */
    .msg-assistant {
      align-self: flex-start;
      width: 100%;
      color: var(--text-primary);
      padding: 6px 4px;
      font-size: 14.5px;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg-assistant code {
      font-family: var(--font-mono);
      font-size: 12.5px;
      background: rgba(255, 255, 255, 0.07);
      padding: 2px 5px;
      border-radius: 4px;
      color: #d2e0ff;
    }

    .msg-assistant pre {
      background: #0d1017;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      font-family: var(--font-mono);
      font-size: 12.5px;
      line-height: 1.5;
      color: #d1d9e6;
      margin: 10px 0;
    }

    /* Non-Primary / Muted Rows (Thoughts & Tool Use) */
    .muted-row {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-muted);
      background: rgba(17, 20, 28, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.045);
      border-radius: 8px;
      overflow: hidden;
      transition: border-color 0.15s;
    }

    .muted-row:hover {
      border-color: rgba(255, 255, 255, 0.1);
    }

    .muted-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 11px;
      cursor: pointer;
      user-select: none;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.done {
      background: var(--accent-green);
      opacity: 0.75;
    }

    .dot.running {
      background: var(--accent-amber);
      animation: pulse 1.2s infinite ease-in-out;
    }

    .dot.thought {
      background: var(--accent-indigo);
      opacity: 0.65;
    }

    .muted-title {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .muted-sub {
      color: var(--text-muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .muted-badge {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(251, 191, 36, 0.12);
      color: var(--accent-amber);
      border: 1px solid rgba(251, 191, 36, 0.25);
    }

    .muted-body {
      display: none;
      padding: 8px 12px 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.045);
      background: rgba(8, 10, 14, 0.65);
      color: var(--text-secondary);
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 240px;
      overflow-y: auto;
      font-size: 11.5px;
    }

    .muted-row.open .muted-body {
      display: block;
    }

    /* Permission Prompt Showcase Card */
    .permission-card {
      background: linear-gradient(180deg, rgba(28, 25, 18, 0.78), rgba(17, 20, 28, 0.92));
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 10px;
      padding: 12px 15px;
      font-size: 12.5px;
      transition: all 0.25s ease;
    }

    .permission-card.approved {
      background: linear-gradient(180deg, rgba(16, 33, 29, 0.65), rgba(17, 20, 28, 0.92));
      border-color: rgba(52, 211, 153, 0.35);
    }

    .perm-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .perm-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: var(--text-primary);
      font-size: 13px;
    }

    .perm-status {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(251, 191, 36, 0.15);
      color: var(--accent-amber);
      border: 1px solid rgba(251, 191, 36, 0.35);
    }

    .permission-card.approved .perm-status {
      background: rgba(52, 211, 153, 0.14);
      color: var(--accent-green);
      border-color: rgba(52, 211, 153, 0.35);
    }

    .perm-meta {
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-secondary);
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      padding: 8px 10px;
      margin-bottom: 8px;
      white-space: pre-wrap;
    }

    .perm-options {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .perm-opt {
      padding: 3px 8px;
      border-radius: 5px;
    }

    .perm-opt.selected {
      background: rgba(88, 148, 255, 0.14);
      color: var(--accent-blue);
      font-weight: 600;
    }

    /* AskQuestion Interactive Modal Card */
    .ask-card {
      background: linear-gradient(180deg, rgba(24, 22, 42, 0.82), rgba(17, 20, 28, 0.95));
      border: 1px solid rgba(124, 106, 255, 0.45);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      transition: all 0.2s ease;
    }

    .ask-card.answered {
      background: linear-gradient(180deg, rgba(19, 25, 36, 0.72), rgba(15, 18, 25, 0.9));
      border-color: rgba(88, 148, 255, 0.25);
      box-shadow: none;
    }

    .ask-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .ask-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(124, 106, 255, 0.16);
      color: #b5a8ff;
      border: 1px solid rgba(124, 106, 255, 0.38);
    }

    .ask-card.answered .ask-badge {
      background: rgba(52, 211, 153, 0.14);
      color: var(--accent-green);
      border-color: rgba(52, 211, 153, 0.35);
    }

    .ask-q-block {
      background: rgba(10, 12, 18, 0.55);
      border: 1px solid var(--border-subtle);
      border-radius: 9px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .ask-q-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .ask-q-mode {
      font-family: var(--font-mono);
      font-size: 10.5px;
      font-weight: 500;
      color: var(--text-muted);
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.05);
    }

    .ask-options-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ask-opt-btn {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      text-align: left;
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: var(--text-secondary);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 7px;
      padding: 7px 11px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .ask-opt-btn:hover:not(:disabled) {
      background: rgba(88, 148, 255, 0.09);
      border-color: rgba(88, 148, 255, 0.3);
      color: var(--text-primary);
    }

    .ask-opt-btn.active {
      background: rgba(88, 148, 255, 0.16);
      border-color: rgba(88, 148, 255, 0.55);
      color: var(--text-primary);
      font-weight: 500;
    }

    .ask-opt-btn:disabled {
      cursor: default;
    }

    .ask-opt-indicator {
      color: var(--accent-blue);
      font-weight: 700;
      width: 18px;
      flex-shrink: 0;
    }

    .ask-writein-wrap {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ask-writein-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-subtle);
      border-radius: 7px;
      padding: 7px 10px;
      color: var(--text-primary);
      font-family: var(--font-mono);
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .ask-writein-input:focus {
      border-color: var(--accent-indigo);
    }

    .ask-answer-summary {
      margin-top: 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--accent-green);
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.22);
      border-radius: 6px;
      padding: 6px 10px;
    }

    .ask-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-ask-skip {
      padding: 6px 12px;
      border-radius: 7px;
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-secondary);
      font-size: 12px;
      font-family: var(--font-mono);
      cursor: pointer;
    }

    .btn-ask-skip:hover {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-primary);
    }

    .btn-ask-submit {
      padding: 6px 14px;
      border-radius: 7px;
      border: none;
      background: linear-gradient(135deg, var(--accent-indigo), var(--accent-blue));
      color: #fff;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-ask-submit:hover {
      opacity: 0.92;
    }

    /* Bottom Composer */
    .composer-wrap {
      padding: 12px 20px 18px;
      background: linear-gradient(180deg, rgba(10, 12, 16, 0) 0%, var(--bg-base) 25%);
    }

    .composer-box {
      max-width: 820px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 10px 12px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .composer-box:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(88, 148, 255, 0.1);
    }

    .composer-input {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: var(--font-sans);
      font-size: 14px;
      resize: none;
      outline: none;
      min-height: 24px;
      max-height: 140px;
      line-height: 1.5;
    }

    .composer-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 8px;
      padding-top: 6px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 7px;
      font-family: var(--font-mono);
      font-size: 11.5px;
    }

    .btn-send {
      padding: 5px 14px;
      border-radius: 7px;
      border: none;
      background: var(--accent-blue);
      color: #fff;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.35; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">A</div>
      <span>Antigravity</span>
      <span class="brand-sub">YOLO PTY · Auto-Enter</span>
    </div>

    <div class="controls">
      <!-- Base Path Selector -->
      <div class="control-group" title="Workspace base directory (cwd) passed to node-pty">
        <span class="control-label">Path</span>
        <input id="cwdInput" class="path-input" list="workspacePresets" placeholder="/Users/tofu/Projects/..." />
        <datalist id="workspacePresets"></datalist>
      </div>

      <!-- Session Switcher -->
      <div class="control-group" title="Switch or inspect AGY conversation session">
        <span class="control-label">Session</span>
        <select id="sessionSelect" class="session-select">
          <option value="">New Session (Unbound)</option>
        </select>
      </div>

      <!-- New Session Button -->
      <button id="newSessionBtn" class="btn-new" type="button">
        <span>+ New Session</span>
      </button>
    </div>
  </header>

  <!-- Main Chat & Event Stream -->
  <main id="viewport" class="main-viewport">
    <div id="stream" class="stream-container"></div>
  </main>

  <!-- Bottom Input Box -->
  <footer class="composer-wrap">
    <div class="composer-box">
      <textarea
        id="promptInput"
        class="composer-input"
        rows="2"
        placeholder="Ask Antigravity anything... (Enter to send, Shift+Enter for newline)"
      ></textarea>
      <div class="composer-footer">
        <div class="status-indicator">
          <span id="statusDot" class="dot done"></span>
          <span id="statusText">Idle · Ready</span>
        </div>
        <button id="sendBtn" class="btn-send" type="button">Send ↵</button>
      </div>
    </div>
  </footer>

  <script>
    let currentSessionId = null;
    let isRunning = false;
    let renderedItems = [];
    let renderedPermissions = [];

    // Preserve user's option selections & write-in text per question across live transcript refreshes
    const questionDrafts = new Map();

    const streamEl = document.getElementById('stream');
    const viewportEl = document.getElementById('viewport');
    const cwdInput = document.getElementById('cwdInput');
    const workspacePresetsEl = document.getElementById('workspacePresets');
    const sessionSelect = document.getElementById('sessionSelect');
    const newSessionBtn = document.getElementById('newSessionBtn');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    function setStatus(state, message) {
      statusText.textContent = message;
      statusDot.className = 'dot ' + (state === 'idle' ? 'done' : 'running');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function formatMarkdownLite(text) {
      let html = escapeHtml(text);
      html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, _lang, code) => {
        return `<pre>${code.trim()}</pre>`;
      });
      html = html.replace(/`([^`\n]+)`/g, '<code>$1</code>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      return html;
    }

    function scrollToBottom() {
      viewportEl.scrollTop = viewportEl.scrollHeight;
    }

    function useQuickPrompt(text) {
      promptInput.value = text;
      promptInput.focus();
    }

    function getDraft(itemId, qIdx, isMulti) {
      const key = `${itemId}::${qIdx}`;
      if (!questionDrafts.has(key)) {
        questionDrafts.set(key, {
          selectedIndices: isMulti ? [] : [0],
          writeIn: ''
        });
      }
      return questionDrafts.get(key);
    }

    function toggleAskOption(itemId, qIdx, optIdx, isMulti) {
      const draft = getDraft(itemId, qIdx, isMulti);
      if (isMulti) {
        const pos = draft.selectedIndices.indexOf(optIdx);
        if (pos >= 0) {
          draft.selectedIndices.splice(pos, 1);
        } else {
          draft.selectedIndices.push(optIdx);
        }
      } else {
        draft.selectedIndices = [optIdx];
        draft.writeIn = '';
      }
      renderStream();
    }

    function updateAskWriteIn(itemId, qIdx, isMulti, value) {
      const draft = getDraft(itemId, qIdx, isMulti);
      draft.writeIn = value;
    }

    async function submitAskQuestionCard(itemId, action = 'submit') {
      const item = renderedItems.find((i) => i.id === itemId);
      if (!item) return;

      const questions = item.questions || [];
      const answers = questions.map((q, qIdx) => {
        const draft = getDraft(itemId, qIdx, Boolean(q.is_multi_select));
        return {
          selectedIndices: draft.selectedIndices,
          writeIn: (draft.writeIn || '').trim()
        };
      });

      setStatus('running', action === 'skip' ? 'Skipping AskQuestion in PTY...' : 'Sending AskQuestion answer to PTY...');

      const res = await fetch('/api/ask-question', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          sessionId: currentSessionId,
          stepIndex: item.stepIndex,
          action,
          answers
        })
      });

      if (res.status === 409 && !isRunning) {
        // Historical session where the previous PTY exited before AskQuestion was answered:
        // Resume the session directly with the user's chosen answer text!
        const summaryLines = questions.map((q, qIdx) => {
          if (action === 'skip') return 'Skip';
          const ans = answers[qIdx];
          if (ans.writeIn) return ans.writeIn;
          const opts = q.options || [];
          return ans.selectedIndices.map((i) => opts[i]).filter(Boolean).join(', ') || opts[0] || '';
        });
        promptInput.value = summaryLines.join('\n');
        await sendChat();
      }
    }

    function renderAskQuestionCard(item) {
      const isAnswered = item.status === 'done';
      const cardClass = isAnswered ? 'ask-card answered' : 'ask-card';
      const badgeText = isAnswered
        ? '✓ Answered'
        : isRunning
          ? '● Interactive Question · Waiting for your selection'
          : '○ Unanswered · Submit to Resume Session';

      const questions = item.questions || [];
      const qBlocks = questions.map((q, qIdx) => {
        const isMulti = Boolean(q.is_multi_select);
        const options = Array.isArray(q.options) ? q.options : [];
        const draft = getDraft(item.id, qIdx, isMulti);
        const recordedAnswer = item.parsedAnswers && item.parsedAnswers[qIdx];

        const optsHtml = options
          .map((optText, optIdx) => {
            const isSelected = isAnswered
              ? recordedAnswer && recordedAnswer.includes(optText)
              : draft.selectedIndices.includes(optIdx) && !draft.writeIn;
            const activeClass = isSelected ? 'active' : '';
            const indicator = isMulti
              ? isSelected
                ? '[✓]'
                : '[ ]'
              : isSelected
                ? '▸'
                : `${optIdx + 1}.`;

            return `
              <button
                type="button"
                class="ask-opt-btn ${activeClass}"
                ${isAnswered ? 'disabled' : ''}
                onclick="toggleAskOption('${item.id}', ${qIdx}, ${optIdx}, ${isMulti})"
              >
                <span class="ask-opt-indicator">${indicator}</span>
                <span>${escapeHtml(optText)}</span>
              </button>
            `;
          })
          .join('');

        const footerSection = isAnswered
          ? `<div class="ask-answer-summary">Answer: ${escapeHtml(recordedAnswer || (item.output || '').trim() || 'Skipped')}</div>`
          : `
            <div class="ask-writein-wrap">
              <input
                type="text"
                class="ask-writein-input"
                placeholder="${options.length + 1}. Write-in... (type custom response)"
                value="${escapeHtml(draft.writeIn)}"
                oninput="updateAskWriteIn('${item.id}', ${qIdx}, ${isMulti}, this.value)"
                onkeydown="if (event.key === 'Enter') { event.preventDefault(); submitAskQuestionCard('${item.id}', 'submit'); }"
              />
            </div>
          `;

        return `
          <div class="ask-q-block">
            <div class="ask-q-title">
              <span>Question ${qIdx + 1}/${questions.length}: ${escapeHtml(q.question || '')}</span>
              <span class="ask-q-mode">${isMulti ? 'Multi-select (Space / Checkboxes)' : 'Single-select'}</span>
            </div>
            <div class="ask-options-list">${optsHtml}</div>
            ${footerSection}
          </div>
        `;
      });

      const actionsHtml = isAnswered
        ? ''
        : `
          <div class="ask-actions">
            <button type="button" class="btn-ask-skip" onclick="submitAskQuestionCard('${item.id}', 'skip')">
              Skip (Esc)
            </button>
            <button type="button" class="btn-ask-submit" onclick="submitAskQuestionCard('${item.id}', 'submit')">
              Submit Answer ↵
            </button>
          </div>
        `;

      return `
        <div class="${cardClass}" id="${item.id}">
          <div class="ask-top">
            <div class="perm-title">
              <span>? AskQuestion · ${escapeHtml(item.summary || 'Clarification Required')}</span>
            </div>
            <span class="ask-badge">${badgeText}</span>
          </div>
          ${qBlocks.join('')}
          ${actionsHtml}
        </div>
      `;
    }

    function renderStream() {
      if (renderedItems.length === 0 && renderedPermissions.length === 0) {
        streamEl.innerHTML = `
          <div class="empty-state">
            <h2>Antigravity Headless PTY Session</h2>
            <p>
              Messages, tool calls, and interactive <code>ask_question</code> modals stream live from <code>transcript_full.jsonl</code> while the Node.js thin server auto-approves permission prompts in the TUI.
            </p>
            <div class="quick-chips">
              <button class="chip" onclick="useQuickPrompt('Read lines 1 to 3 of /Users/tofu/.zshrc using view_file and summarize them.')">
                Trigger Outside-Workspace Prompt (~/.zshrc)
              </button>
              <button class="chip" onclick="useQuickPrompt('Call ask_question to ask me whether this repo should be Private or Public, then repeat my answer.')">
                Trigger Interactive ask_question UI
              </button>
              <button class="chip" onclick="useQuickPrompt('Run echo HELLO_AGY_SANDBOX using run_command with BypassSandbox set to true.')">
                Trigger Unsandboxed Command Prompt
              </button>
            </div>
          </div>
        `;
        return;
      }

      const openIds = new Set(
        Array.from(streamEl.querySelectorAll('.muted-row.open')).map((el) => el.dataset.id)
      );

      const fragments = [];
      const placedPermIds = new Set();

      function renderPermCard(perm) {
        placedPermIds.add(perm.id);
        const isApproved = perm.status === 'approved';
        const cardClass = isApproved ? 'permission-card approved' : 'permission-card';
        const statusLabel = isApproved
          ? '✓ Auto-Approved · Simulated Enter (\\r)'
          : '● Prompt Detected · Sending Enter (350ms)...';

        const metaLines = [perm.target, perm.reason, perm.question].filter(Boolean).join('\n');
        const optionsHtml = (perm.options || [])
          .map((opt, idx) => {
            const sel = idx === 0 ? 'perm-opt selected' : 'perm-opt';
            const prefix = idx === 0 ? '↵ ' : '  ';
            return `<div class="${sel}">${escapeHtml(prefix + opt)}</div>`;
          })
          .join('');

        return `
          <div class="${cardClass}" id="${perm.id}">
            <div class="perm-top">
              <div class="perm-title">
                <span>⚡ TUI Permission Intercepted: ${escapeHtml(perm.title || 'Permission Prompt')}</span>
              </div>
              <span class="perm-status">${statusLabel}</span>
            </div>
            <div class="perm-meta">${escapeHtml(metaLines || perm.snippet)}</div>
            <div class="perm-options">${optionsHtml}</div>
          </div>
        `;
      }

      for (const item of renderedItems) {
        if (item.role === 'user') {
          fragments.push(`<div class="msg-user">${escapeHtml(item.content)}</div>`);
        } else if (item.role === 'thought') {
          const isOpen = openIds.has(item.id) ? 'open' : '';
          const firstLine = item.content.split(/\r?\n/)[0].slice(0, 90);
          fragments.push(`
            <div class="muted-row ${isOpen}" data-id="${item.id}" onclick="this.classList.toggle('open')">
              <div class="muted-header">
                <span class="dot thought"></span>
                <span class="muted-title">Thought</span>
                <span class="muted-sub">${escapeHtml(firstLine)}</span>
              </div>
              <div class="muted-body">${escapeHtml(item.content)}</div>
            </div>
          `);
        } else if (item.role === 'ask_question') {
          fragments.push(renderAskQuestionCard(item));
        } else if (item.role === 'tool_call') {
          const isOpen = openIds.has(item.id) ? 'open' : '';
          const dotClass = item.status === 'done' ? 'done' : 'running';
          const bypassBadge = item.bypassSandbox
            ? `<span class="muted-badge">BypassSandbox</span>`
            : '';
          const bodyText =
            `Args: ${JSON.stringify(item.args, null, 2)}` +
            (item.output ? `\n\nOutput:\n${item.output.trim()}` : '\n\n(Waiting for tool execution...)');

          fragments.push(`
            <div class="muted-row ${isOpen}" data-id="${item.id}" onclick="this.classList.toggle('open')">
              <div class="muted-header">
                <span class="dot ${dotClass}"></span>
                <span class="muted-title">${escapeHtml(item.toolName)}</span>
                <span class="muted-sub">${escapeHtml(item.summary)} ${item.detail ? '· ' + escapeHtml(item.detail) : ''}</span>
                ${bypassBadge}
              </div>
              <div class="muted-body">${escapeHtml(bodyText)}</div>
            </div>
          `);

          for (const perm of renderedPermissions) {
            if (!placedPermIds.has(perm.id) && perm.afterStepIndex === item.stepIndex) {
              fragments.push(renderPermCard(perm));
            }
          }
        } else if (item.role === 'assistant') {
          fragments.push(`<div class="msg-assistant">${formatMarkdownLite(item.content)}</div>`);
        }
      }

      for (const perm of renderedPermissions) {
        if (!placedPermIds.has(perm.id)) {
          fragments.push(renderPermCard(perm));
        }
      }

      streamEl.innerHTML = fragments.join('\n');
    }

    async function loadWorkspaces() {
      const res = await fetch('/api/workspaces');
      const data = await res.json();
      cwdInput.value = data.defaultWorkspace || '';
      workspacePresetsEl.innerHTML = (data.workspaces || [])
        .map((w) => `<option value="${escapeHtml(w)}"></option>`)
        .join('');
    }

    async function refreshSessionList(selectedId = currentSessionId) {
      const res = await fetch('/api/sessions');
      const data = await res.json();
      const sessions = data.sessions || [];

      const options = [`<option value="">+ New Session (Unbound)</option>`];
      for (const s of sessions) {
        const isSelected = s.id === selectedId ? 'selected' : '';
        const shortId = s.id.slice(0, 8);
        const label = `${shortId} · ${(s.title || 'Untitled').slice(0, 34)} (${s.stepCount} steps)`;
        options.push(`<option value="${escapeHtml(s.id)}" ${isSelected}>${escapeHtml(label)}</option>`);
      }
      sessionSelect.innerHTML = options.join('');
    }

    async function loadSession(sessionId) {
      if (!sessionId) {
        currentSessionId = null;
        renderedItems = [];
        renderedPermissions = [];
        sessionSelect.value = '';
        renderStream();
        setStatus('idle', 'New Session · Ready');
        return;
      }

      currentSessionId = sessionId;
      setStatus('running', `Loading session ${sessionId.slice(0, 8)}...`);
      const res = await fetch(`/api/sessions/${encodeURIComponent(sessionId)}`);
      const data = await res.json();
      renderedItems = data.items || [];
      renderedPermissions = data.permissions || [];
      renderStream();
      scrollToBottom();
      setStatus('idle', `Session ${sessionId.slice(0, 8)} loaded`);
    }

    async function sendChat() {
      const prompt = promptInput.value.trim();
      if (!prompt || isRunning) return;

      isRunning = true;
      sendBtn.disabled = true;
      promptInput.value = '';

      renderedItems.push({
        id: `optimistic-${Date.now()}`,
        role: 'user',
        content: prompt
      });
      renderStream();
      scrollToBottom();

      setStatus('running', currentSessionId ? 'Resuming session in PTY...' : 'Spawning new AGY PTY session...');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            prompt,
            sessionId: currentSessionId,
            cwd: cwdInput.value.trim()
          })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });

          const frames = buffer.split('\n\n');
          buffer = frames.pop();

          for (const frame of frames) {
            const lines = frame.split('\n');
            const evtLine = lines.find((l) => l.startsWith('event: '));
            const dataLine = lines.find((l) => l.startsWith('data: '));
            if (!evtLine || !dataLine) continue;

            const event = evtLine.slice(7).trim();
            const data = JSON.parse(dataLine.slice(6));

            if (event === 'session') {
              currentSessionId = data.sessionId;
              await refreshSessionList(currentSessionId);
              setStatus('running', `Session ${currentSessionId.slice(0, 8)} active · Running...`);
            } else if (event === 'status') {
              setStatus('running', data.message);
            } else if (event === 'transcript') {
              renderedItems = data.items || [];
              renderStream();
              scrollToBottom();
            } else if (event === 'ask_question') {
              setStatus('running', 'Waiting for your answer in AskQuestion card...');
              renderStream();
              scrollToBottom();
            } else if (event === 'permission_prompt') {
              const existingIdx = renderedPermissions.findIndex((p) => p.id === data.id);
              if (existingIdx >= 0) {
                renderedPermissions[existingIdx] = data;
              } else {
                renderedPermissions.push(data);
              }
              setStatus('running', 'Permission prompt detected in TUI · Simulating Enter...');
              renderStream();
              scrollToBottom();
            } else if (event === 'enter_simulated') {
              const existingIdx = renderedPermissions.findIndex((p) => p.id === data.id);
              if (existingIdx >= 0) {
                renderedPermissions[existingIdx] = data;
              } else {
                renderedPermissions.push(data);
              }
              setStatus('running', 'Simulated Enter (\\r) sent · Resuming execution...');
              renderStream();
              scrollToBottom();
            } else if (event === 'exit') {
              if (data.sessionId) {
                currentSessionId = data.sessionId;
              }
              if (Array.isArray(data.items) && data.items.length > 0) {
                renderedItems = data.items;
              }
              await refreshSessionList(currentSessionId);
              renderStream();
              scrollToBottom();
              setStatus(
                'idle',
                `Idle · Session ${currentSessionId ? currentSessionId.slice(0, 8) : ''} (exit=${data.exitCode})`
              );
            }
          }
        }
      } catch (err) {
        setStatus('idle', `Error: ${err.message}`);
      } finally {
        isRunning = false;
        sendBtn.disabled = false;
        renderStream();
        promptInput.focus();
      }
    }

    newSessionBtn.addEventListener('click', () => {
      if (isRunning) return;
      loadSession(null);
    });

    sessionSelect.addEventListener('change', (e) => {
      if (isRunning) return;
      loadSession(e.target.value || null);
    });

    sendBtn.addEventListener('click', sendChat);

    promptInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendChat();
      }
    });

    (async () => {
      await loadWorkspaces();
      await refreshSessionList(null);
      renderStream();
    })();
  </script>
</body>
</html>
